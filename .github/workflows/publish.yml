name: Publish

on:
    push:
        branches: ["main", "dev"]
    workflow_dispatch:
        inputs:
            run-id:
                description: run-id
                required: true
                type: string

    # release:
    #     types: [created]

jobs:
    build:
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v4
              with:
                  token: ${{ secrets.GITHUB_TOKEN }}

            - name: Build
              run: echo ${{ inputs }}

            - name: Download a Build Artifact
              uses: actions/download-artifact@v5.0.0
              with:
                  name: dist
                  # path: # optional
                  # run-id: # optional, default is ${{ github.run_id }}
