name: CI

env:
  OWNER: dynehart
  REPO: member-sort

# https://docs.github.com/en/actions/how-tos/reuse-automations/reuse-workflows
on:
  push:
    branches: ["main", "dev"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish?"
        required: true
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Detect changes
        id: changes
        uses: dorny/paths-filter@v3
        with:
          filters: |
            pkg:
              - 'package.json'

      # Determine publish flag:
      # If triggered manually → use workflow_dispatch input
      # If triggered by push → publish only if package.json has changed
      - name: Set publish flag
        id: set-publish
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "publish=${{ inputs.publish }}" >> $GITHUB_OUTPUT
          else
            echo "publish=${{ steps.changes.outputs.pkg }}" >> $GITHUB_OUTPUT
          fi

      - name: workflow debug
        run: echo "Publish = ${{ steps.set-publish.outputs.publish }}"

      - name: Setup PNPM
        run: |
          curl -fsSL https://get.pnpm.io/install.sh | sh -
          echo "PNPM_HOME=$HOME/.local/share/pnpm" >> $GITHUB_ENV
          echo "$HOME/.local/share/pnpm" >> $GITHUB_PATH

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Cache PNPM store
        uses: actions/cache@v4
        with:
          path: ~/.pnpm-store
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Test
        run: pnpm test:coverage

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Build
        run: pnpm build

      - name: Upload build artifacts
        id: upload_step
        uses: actions/upload-artifact@v4.6.2
        with:
          name: pkg
          path: |
            dist
            package.json
            README.md

      # https://docs.github.com/en/rest/actions/workflows?apiVersion=2022-11-28
      - name: Trigger target workflow
        env:
          GH_TOKEN: ${{ secrets.WORKFLOW_TOKEN }}
        if: ${{ steps.set-publish.outputs.publish == true }}
        run: |
          curl -L \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/Dynehart/member-sort/actions/workflows/199830860/dispatches \
            -d '{"ref":"dev","inputs":{"run_id":"${{github.run_id}}", "artifact_id": "${{ steps.upload_step.outputs.artifact-id }}"}}'
